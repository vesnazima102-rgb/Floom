    <link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 25%, #7c4d43 0%, #4b2d27 55%, #2a1815 100%);
            color: #fff8f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 22px 18px 26px;
            overflow-x: hidden;
            position: relative;
        }

        .ambient-garden {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .ambient-flower {
            position: absolute;
            bottom: -48px;
            font-size: 24px;
            opacity: 0.24;
            animation: driftUp linear infinite;
            filter: blur(0.2px);
        }

        @keyframes driftUp {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg) scale(0.9);
                opacity: 0;
            }
            15% {
                opacity: 0.26;
            }
            50% {
                transform: translateY(-52vh) translateX(14px) rotate(12deg) scale(1);
            }
            85% {
                opacity: 0.22;
            }
            100% {
                transform: translateY(-108vh) translateX(-10px) rotate(-10deg) scale(0.95);
                opacity: 0;
            }
        }

        .top-bar {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding-right: 54px;
            padding-left: 54px;
            position: relative;
            z-index: 2;
        }

        .sound-btn {
            position: absolute;
            right: 0;
            top: 2px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: #f48fb1;
            color: #2b1518;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, opacity 0.2s ease, background 0.2s ease;
        }

        .sound-btn:active {
            transform: scale(0.92);
        }

        .sound-btn.muted {
            background: rgba(255, 255, 255, 0.22);
            color: #ffdce7;
            opacity: 0.75;
        }

        .hint-pill {
            background: rgba(34, 19, 16, 0.76);
            border: 1px solid rgba(255, 224, 214, 0.16);
            color: #f6e2dc;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            text-align: center;
            padding: 9px 16px;
            border-radius: 999px;
            backdrop-filter: blur(8px);
        }

        .flower-title {
            background: rgba(34, 19, 16, 0.78);
            border: 1px solid rgba(255, 224, 214, 0.16);
            color: #fff6f2;
            font-size: 20px;
            font-weight: 600;
            padding: 10px 26px;
            border-radius: 22px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .flower-title.fade-label {
            opacity: 0.25;
            transform: translateY(-3px);
        }

        .flower-stage {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px auto;
            z-index: 2;
        }

        .flower-halo {
            position: absolute;
            width: 196px;
            height: 196px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 166, 158, 0.36) 0%, rgba(255, 130, 120, 0.12) 58%, transparent 76%);
            animation: haloBreath 3.6s ease-in-out infinite;
            transition: transform 0.35s ease, opacity 0.35s ease;
            pointer-events: none;
        }

        @keyframes haloBreath {
            0%, 100% {
                transform: scale(0.96);
                opacity: 0.85;
            }
            50% {
                transform: scale(1.06);
                opacity: 1;
            }
        }

        .flower-btn {
            position: relative;
            width: 140px;
            height: 140px;
            border: none;
            background: transparent;
            font-size: 96px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.35));
            animation: gentleSway 3.4s ease-in-out infinite;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.18s ease;
            z-index: 2;
        }

        @keyframes gentleSway {
            0%, 100% {
                transform: translateY(0px) rotate(-3deg) scale(1);
            }
            50% {
                transform: translateY(-7px) rotate(3.5deg) scale(1.03);
            }
        }

        .flower-btn.swapping {
            opacity: 0.25;
            transform: scale(0.78) rotate(-10deg);
        }

        .flower-btn.pulse {
            animation: tapBounce 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes tapBounce {
            0% {
                transform: scale(0.88) rotate(-6deg);
            }
            55% {
                transform: scale(1.2) rotate(5deg);
            }
            100% {
                transform: translateY(0px) rotate(-3deg) scale(1);
            }
        }

        .flower-btn.pulse + .flower-halo {
            transform: scale(1.24);
            opacity: 1;
        }

        .sparkle {
            position: absolute;
            pointer-events: none;
            font-size: 22px;
            animation: floatSparkle 1.1s ease-out forwards;
            z-index: 3;
        }

        @keyframes floatSparkle {
            0% {
                opacity: 0;
                transform: translate(0, 0) scale(0.5) rotate(0deg);
            }
            25% {
                opacity: 1;
                transform: translate(var(--dx), var(--dy)) scale(1.15) rotate(15deg);
            }
            100% {
                opacity: 0;
                transform: translate(calc(var(--dx) * 1.6), calc(var(--dy) * 1.6 - 16px)) scale(0.7) rotate(35deg);
            }
        }

        .compliment-card {
            width: 100%;
            max-width: 440px;
            background: rgba(24, 16, 17, 0.88);
            border: 1px solid rgba(255, 214, 224, 0.14);
            border-radius: 28px;
            padding: 24px 22px 26px;
            text-align: center;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.42);
            backdrop-filter: blur(12px);
            position: relative;
            z-index: 2;
        }

        .card-sprout {
            font-size: 22px;
            margin-bottom: 14px;
            line-height: 1;
            display: inline-block;
            animation: sproutBob 2.6s ease-in-out infinite;
        }

        @keyframes sproutBob {
            0%, 100% {
                transform: translateY(0) rotate(-3deg);
            }
            50% {
                transform: translateY(-3px) rotate(4deg);
            }
        }

        .compliment-text {
            font-family: 'Marck Script', cursive;
            font-size: 30px;
            line-height: 1.28;
            color: #fff9f7;
            min-height: 116px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        .compliment-text.fade-out {
            opacity: 0;
            transform: translateY(6px);
        }

        .next-btn {
            width: 100%;
            border: none;
            border-radius: 18px;
            padding: 15px 20px;
            background: linear-gradient(135deg, #ff85b3 0%, #f06292 100%);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(240, 98, 146, 0.35);
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
        }

        .next-btn:hover {
            filter: brightness(1.04);
        }

        .next-btn:active {
            transform: scale(0.98);
            box-shadow: 0 4px 12px rgba(240, 98, 146, 0.28);
        }
    </style>

        let shuffledQueue = [];
        let queueIndex = 0;
        let currentFlowerIndex = 0;
        let soundEnabled = true;
        let melodyAudio = null;

        function shuffleArray(arr) {
            const copy = arr.slice();
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function refillQueue(avoidText = null) {
            shuffledQueue = shuffleArray(compliments);
            if (avoidText && shuffledQueue.length > 1 && shuffledQueue[0] === avoidText) {
                const swapIdx = 1 + Math.floor(Math.random() * (shuffledQueue.length - 1));
                [shuffledQueue[0], shuffledQueue[swapIdx]] = [shuffledQueue[swapIdx], shuffledQueue[0]];
            }
            queueIndex = 0;
        }

        function getNextUniqueCompliment() {
            const currentText = document.getElementById('complimentText').textContent;
            if (shuffledQueue.length === 0 || queueIndex >= shuffledQueue.length) {
                refillQueue(currentText);
            }
            const phrase = shuffledQueue[queueIndex];
            queueIndex++;
            return phrase;
        }

        function pickNextFlower() {
            let nextIdx = Math.floor(Math.random() * flowerCollection.length);
            if (flowerCollection.length > 1 && nextIdx === currentFlowerIndex) {
                nextIdx = (currentFlowerIndex + 1) % flowerCollection.length;
            }
            currentFlowerIndex = nextIdx;
            return flowerCollection[currentFlowerIndex];
        }

        function ensureMusicPlaying() {
            if (!soundEnabled) return;
            try {
                if (!melodyAudio) {
                    melodyAudio = new Audio('song.mp3');
                    melodyAudio.loop = true;
                }
                if (melodyAudio.paused) {
                    melodyAudio.play().catch(() => {});
                }
            } catch (e) {}
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundBtn');
            btn.textContent = soundEnabled ? '🔊' : '🔇';
            btn.classList.toggle('muted', !soundEnabled);
            if (soundEnabled) {
                ensureMusicPlaying();
            } else if (melodyAudio) {
                melodyAudio.pause();
            }
        }

        function spawnSparkles() {
            const stage = document.getElementById('flowerStage');
            const icons = ['✨', '⭐', '🌟', '💫', '💖', '🌸'];
            const count = 7;
            for (let i = 0; i < count; i++) {
                const el = document.createElement('span');
                el.className = 'sparkle';
                el.textContent = icons[i % icons.length];
                const angle = (Math.PI * 2 / count) * i + (Math.random() * 0.4 - 0.2);
                const dist = 56 + Math.random() * 24;
                el.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
                el.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
                el.style.left = 'calc(50% - 11px)';
                el.style.top = 'calc(50% - 11px)';
                stage.appendChild(el);
                setTimeout(() => el.remove(), 1150);
            }
        }

        function animateAndSwitchFlower() {
            const btn = document.getElementById('flowerBtn');
            const titleEl = document.getElementById('flowerTitle');
            const nextFlower = pickNextFlower();

            btn.classList.remove('pulse');
            btn.classList.add('swapping');
            titleEl.classList.add('fade-label');
            spawnSparkles();

            setTimeout(() => {
                btn.textContent = nextFlower.icon;
                titleEl.textContent = nextFlower.name;
                btn.classList.remove('swapping');
                titleEl.classList.remove('fade-label');
                void btn.offsetWidth;
                btn.classList.add('pulse');
                setTimeout(() => btn.classList.remove('pulse'), 460);
            }, 130);
        }

        function showCompliment(text, animate = true) {
            const el = document.getElementById('complimentText');
            if (!animate) {
                el.textContent = text;
                return;
            }
            el.classList.add('fade-out');
            setTimeout(() => {
                el.textContent = text;
                el.classList.remove('fade-out');
            }, 160);
        }

        function createAmbientFlowers() {
            const container = document.getElementById('ambientGarden');
            const bgFlowers = ['🌸', '🌷', '🌹', '🌻', '🌺', '🌼', '🪷'];
            const total = 10;
            for (let i = 0; i < total; i++) {
                const el = document.createElement('span');
                el.className = 'ambient-flower';
                el.textContent = bgFlowers[i % bgFlowers.length];
                el.style.left = `${(i * 10 + 4) % 94}%`;
                el.style.fontSize = `${20 + (i % 3) * 6}px`;
                const duration = 11 + (i % 5) * 2.5;
                const delay = -(i * 2.2);
                el.style.animationDuration = `${duration}s`;
                el.style.animationDelay = `${delay}s`;
                container.appendChild(el);
            }
        }

        function nextCompliment() {
            ensureMusicPlaying();
            animateAndSwitchFlower();
            showCompliment(getNextUniqueCompliment(), true);
        }

        function handleFlowerTap() {
            ensureMusicPlaying();
            animateAndSwitchFlower();
            showCompliment(getNextUniqueCompliment(), true);
        }

        createAmbientFlowers();
        refillQueue();
        showCompliment(getNextUniqueCompliment(), false);
